name: Build & Release

# 推送 v* 版本标签时构建三平台安装包并发布 GitHub Release；
# 也支持在 Actions 页面手动触发（仅验证构建）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# GITHUB_TOKEN 默认可能只读，创建/更新 Release 与上传安装包需要写权限
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: linux
          - os: windows-latest
            runner: windows
          # macos-latest 当前为 Apple Silicon；Intel Mac 可改 macos-13
          - os: macos-latest
            runner: macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Linux 构建 Tauri 所需的 WebKitGTK 等系统依赖
      - name: 安装 Linux 系统依赖
        if: runner.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装后端 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      # DMG 打包是 Tauri 已知的偶发故障点：上次失败可能残留挂载卷，
      # 导致本次 hdiutil/AppleScript 失败。打包前强制清理同名卷。
      - name: 清理残留的 DMG 挂载卷
        if: runner.os == 'macOS'
        run: |
          # 卸载所有同名残留卷（不存在时通配符保持原样，[ -d ] 自动跳过）
          for vol in /Volumes/FormatWarp*; do
            if [ -d "$vol" ]; then
              echo "detach: $vol"
              hdiutil detach "$vol" -force || true
            fi
          done

      # tauri build 会触发 beforeBuildCommand：
      #   npm run build（前端）+ python ../scripts/build_sidecar.py（sidecar）
      # sidecar 构建会自动下载对应平台的内置 pandoc。
      - name: 构建 Tauri 应用并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows runner 默认 cp1252，强制子进程使用 UTF-8，防止中文 print 崩溃
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        with:
          projectPath: frontend
          # tauri-action 会自动追加 build 子命令，脚本本身只到 tauri
          tauriScript: npm run tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('ci-{0}', github.run_number) }}
          releaseName: "FormatWarp ${{ github.ref_type == 'tag' && github.ref_name || format('ci-{0}', github.run_number) }}"
          releaseBody: |
            FormatWarp（格式跃迁）v${{ github.ref_type == 'tag' && github.ref_name || format('ci-{0}', github.run_number) }}
            安装包：Linux（.deb / .AppImage）、Windows（.msi / .exe）、macOS（.dmg）
            首次在 Windows/macOS 打开如遇安全提示，选择“仍要运行/打开”。
          releaseDraft: true
          prerelease: false
